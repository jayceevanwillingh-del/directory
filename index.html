<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNED Staff Directory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --blue: #005596; --gold: #ffcc00; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: var(--bg); }

        /* BANNER */
        .banner {
            background: linear-gradient(rgba(0,85,150,0.6), rgba(0,85,150,0.6)), url('banner.png');
            background-size: cover; background-position: center; height: 250px;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; color: white; border-bottom: 6px solid var(--gold);
        }

        /* SEARCH */
        .search-container { max-width: 600px; margin: -25px auto 30px; padding: 0 20px; }
        #searchBox {
            width: 100%; padding: 15px 25px; border-radius: 50px; border: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); font-size: 1rem; outline: none;
        }

        /* TILES */
        .container { max-width: 1100px; margin: auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .tile { 
            background: white; padding: 40px 20px; text-align: center; border-radius: 15px; 
            cursor: pointer; transition: 0.3s; color: var(--blue); font-weight: bold;
            border-bottom: 4px solid var(--blue); display: flex; flex-direction: column; gap: 10px;
        }
        .tile:hover { transform: translateY(-5px); background: var(--blue); color: white; }

        /* LIST VIEW (HIDDEN BY DEFAULT) */
        #directory-section { display: none; }
        .card { 
            background: white; padding: 20px; border-radius: 10px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
            border-left: 5px solid var(--blue);
        }
        .btn-back { 
            background: var(--blue); color: white; border: none; padding: 10px 20px; 
            border-radius: 5px; cursor: pointer; margin-bottom: 20px; 
        }
        .actions a { color: var(--blue); font-size: 1.4rem; margin-left: 15px; }
    </style>
</head>
<body>

<div id="home-section">
    <div class="banner">
        <h1>MNED Staff Directory</h1>
        <p>Western Cape Education Department</p>
    </div>
    <div class="search-container">
        <input type="text" id="searchBox" placeholder="Search name or position..." onkeyup="search()">
    </div>
    <div class="container">
        <div class="grid">
            <div class="tile" onclick="openDept('Curriculum')"><i class="fa-solid fa-book"></i>Curriculum</div>
            <div class="tile" onclick="openDept('ISLES')"><i class="fa-solid fa-graduation-cap"></i>ISLES</div>
            <div class="tile" onclick="openDept('Management')"><i class="fa-solid fa-user-tie"></i>Management & Gov</div>
            <div class="tile" onclick="openDept('Finance')"><i class="fa-solid fa-coins"></i>Finance/SCM</div>
            <div class="tile" onclick="openDept('DMT')"><i class="fa-solid fa-laptop"></i>DMT (IT)</div>
            <div class="tile" onclick="openDept('Circuit')"><i class="fa-solid fa-map-pin"></i>All Circuits</div>
        </div>
    </div>
</div>

<div id="directory-section" class="container">
    <button class="btn-back" onclick="goHome()">⬅ Back to Main Menu</button>
    <h2 id="dept-name" style="color:var(--blue)"></h2>
    <div id="list-container"></div>
</div>

<script>
    let staffData = [];

    // LOAD DATA IMMEDIATELY
    async function loadData() {
        try {
            const response = await fetch('directory.csv');
            const data = await response.text();
            const rows = data.split('\n').filter(r => r.trim() !== '');
            const headers = rows[0].split(',').map(h => h.trim());
            
            staffData = rows.slice(1).map(row => {
                const values = row.split(',');
                let person = {};
                headers.forEach((h, i) => person[h] = values[i] ? values[i].trim() : '');
                return person;
            });
            console.log("Data loaded successfully!");
        } catch (e) {
            console.error("Error loading CSV:", e);
        }
    }
    loadData();

    function openDept(dept) {
        document.getElementById('home-section').style.display = 'none';
        document.getElementById('directory-section').style.display = 'block';
        document.getElementById('dept-name').innerText = dept;

        const filtered = staffData.filter(p => 
            (p.Department || '').toLowerCase().includes(dept.toLowerCase().split(' ')[0])
        );
        render(filtered);
    }

    function search() {
        const query = document.getElementById('searchBox').value.toLowerCase();
        if(query.length > 2) {
            document.getElementById('home-section').style.display = 'none';
            document.getElementById('directory-section').style.display = 'block';
            document.getElementById('dept-name').innerText = "Search Results";
            const filtered = staffData.filter(p => 
                p.Name.toLowerCase().includes(query) || p.Role.toLowerCase().includes(query)
            );
            render(filtered);
        }
    }

    function goHome() {
        document.getElementById('home-section').style.display = 'block';
        document.getElementById('directory-section').style.display = 'none';
        document.getElementById('searchBox').value = "";
    }

    function render(list) {
        const div = document.getElementById('list-container');
        div.innerHTML = list.length ? "" : "<h3>No matches found.</h3>";
        list.sort((a,b) => a.Name.localeCompare(b.Name)).forEach(p => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div>
                    <h3 style="margin:0; color:var(--blue);">${p.Name}</h3>
                    <p style="margin:5px 0 0;">${p.Role}</p>
                </div>
                <div class="actions">
                    <a href="mailto:${p.Email}"><i class="fa-solid fa-envelope"></i></a>
                    <a href="tel:${p.Phone}"><i class="fa-solid fa-phone"></i></a>
                </div>
            `;
            div.appendChild(card);
        });
    }
</script>

</body>
</html>
