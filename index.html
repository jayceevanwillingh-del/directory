<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNED Staff Directory</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f0f2f5; color: #333; }
        .container { max-width: 800px; margin: auto; }
        h1 { color: #0056b3; text-align: center; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }
        .menu-btn { padding: 20px; font-size: 18px; cursor: pointer; background: #0056b3; color: white; border: none; border-radius: 10px; transition: 0.3s; }
        .menu-btn:hover { background: #004494; transform: translateY(-2px); }
        #directory-view, #home-view { display: block; }
        #directory-view { display: none; }
        .person-card { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .back-btn { background: #6c757d; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
        .actions a { text-decoration: none; margin-left: 15px; font-size: 22px; }
        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; position: relative; }
        .close-modal { position: absolute; top: 10px; right: 15px; font-size: 25px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div id="home-view">
        <h1>MNED Staff Directory</h1>
        <p style="text-align: center;">Click a department to view staff members.</p>
        <div class="menu-grid">
            <button class="menu-btn" onclick="openDept('Curriculum')">Curriculum</button>
            <button class="menu-btn" onclick="openDept('ISLES')">ISLES</button>
            <button class="menu-btn" onclick="openDept('Management')">Management & Gov</button>
            <button class="menu-btn" onclick="openDept('Finance')">Finance/SCM</button>
            <button class="menu-btn" onclick="openDept('DMT')">DMT (IT)</button>
            <button class="menu-btn" onclick="openDept('Circuit')">All Circuits</button>
        </div>
    </div>

    <div id="directory-view">
        <button class="back-btn" onclick="goHome()">⬅ Back to Menu</button>
        <h2 id="dept-title" style="color: #0056b3;"></h2>
        <div id="people-grid"></div>
    </div>
</div>

<div id="modal-overlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h2 id="m-name" style="margin-top: 0; color: #0056b3;"></h2>
        <p><strong>Role:</strong> <span id="m-role"></span></p>
        <p><strong>Email:</strong> <span id="m-email"></span></p>
        <p><strong>Phone:</strong> <span id="m-phone"></span></p>
        <p><strong>Office:</strong> <span id="m-office"></span></p>
        <hr>
        <button style="width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;" id="vcard-btn">Save to Contacts</button>
    </div>
</div>

<script>
    let fullData = [];

    // --- AUTOMATIC DATA LOADING ---
    // This runs the instant the page opens
    window.onload = function() {
        const url = 'directory.csv'; // IT LOOKS FOR THIS FILE IN YOUR GITHUB
        
        fetch(url)
            .then(response => {
                if (!response.ok) throw new Error("File directory.csv not found on GitHub");
                return response.text();
            })
            .then(csvText => {
                fullData = parseCSV(csvText);
                console.log("Automatically loaded " + fullData.length + " staff members.");
            })
            .catch(err => {
                console.error(err);
                alert("ERROR: Make sure 'directory.csv' is uploaded to your GitHub repository folder.");
            });
    };

    function parseCSV(text) {
        const lines = text.split('\n').filter(l => l.trim() !== '');
        const headers = lines[0].split(',').map(h => h.trim());
        return lines.slice(1).map(line => {
            const values = line.split(',');
            let obj = {};
            headers.forEach((h, i) => {
                obj[h] = values[i] ? values[i].trim() : '';
            });
            return obj;
        });
    }

    function openDept(dept) {
        // WE REMOVED THE "IF !FULLDATA.LENGTH" ALERT - IT WILL NO LONGER ASK TO UPLOAD
        document.getElementById('home-view').style.display = 'none';
        document.getElementById('directory-view').style.display = 'block';
        document.getElementById('dept-title').innerText = dept;
        
        const filtered = fullData.filter(p => 
            (p.Department || '').toLowerCase().includes(dept.toLowerCase().split(' ')[0])
        );
        render(filtered);
    }

    function goHome() {
        document.getElementById('home-view').style.display = 'block';
        document.getElementById('directory-view').style.display = 'none';
    }

    function render(list) {
        const grid = document.getElementById('people-grid');
        grid.innerHTML = list.length ? "" : "<h3>No staff found in this section.</h3>";
        
        list.sort((a, b) => (a.Name || "").localeCompare(b.Name || "")).forEach(p => {
            const div = document.createElement('div');
            div.className = 'person-card';
            div.innerHTML = `
                <div style="cursor:pointer" onclick="showPerson('${p.Name}')">
                    <h3 style="margin:0;">${p.Name}</h3>
                    <p style="margin:5px 0 0; color:#666;">${p.Role}</p>
                </div>
                <div class="actions">
                    <a href="mailto:${p.Email}">✉️</a>
                    <a href="tel:${p.Phone}">📞</a>
                </div>
            `;
            grid.appendChild(div);
        });
    }

    function showPerson(name) {
        const p = fullData.find(x => x.Name === name);
        if(!p) return;
        document.getElementById('m-name').innerText = p.Name;
        document.getElementById('m-role').innerText = p.Role;
        document.getElementById('m-email').innerText = p.Email || 'N/A';
        document.getElementById('m-phone').innerText = p.Phone || 'N/A';
        document.getElementById('m-office').innerText = p.Office || 'N/A';
        
        document.getElementById('vcard-btn').onclick = () => {
            const vcf = `BEGIN:VCARD\nVERSION:3.0\nFN:${p.Name}\nEMAIL:${p.Email}\nTEL:${p.Phone}\nEND:VCARD`;
            const blob = new Blob([vcf], {type:'text/vcard'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = p.Name + '.vcf';
            a.click();
        };
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
    }
</script>

</body>
</html>
