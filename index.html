<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNED Staff Directory</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #005596;
            --accent: #ffcc00;
            --bg: #f4f4f9;
        }

        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: var(--bg); }

        /* --- THE BANNER (Update image name below) --- */
        .banner {
            background: linear-gradient(rgba(0, 85, 150, 0.5), rgba(0, 85, 150, 0.5)), 
                        url('banner.jpg'); /* CHANGE THIS to your image name */
            background-size: cover;
            background-position: center;
            color: white;
            padding: 80px 20px;
            text-align: center;
            border-bottom: 6px solid var(--accent);
        }

        /* --- THE TILES --- */
        .container { max-width: 1100px; margin: -40px auto 40px; padding: 0 20px; }
        
        .menu-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 20px; 
        }

        .menu-btn { 
            background: white;
            padding: 40px 20px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: var(--primary);
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            border: none; /* Fixes potential button border issues */
        }

        .menu-btn i { font-size: 2.5rem; }

        .menu-btn:hover { 
            background: var(--primary); 
            color: white; 
            transform: translateY(-10px); 
        }

        /* --- DIRECTORY VIEW --- */
        #directory-view { display: none; padding-top: 60px; }
        
        .person-card { 
            background: white; padding: 15px 25px; border-radius: 10px;
            margin-bottom: 12px; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 6px solid var(--primary);
        }

        .back-btn {
            background: var(--primary); color: white; border: none;
            padding: 10px 20px; border-radius: 5px; cursor: pointer;
            margin-bottom: 20px; font-weight: bold;
        }

        .actions a { color: var(--primary); font-size: 1.3rem; margin-left: 15px; }
    </style>
</head>
<body>

    <div id="home-view">
        <div class="banner">
            <h1>MNED Staff Directory</h1>
            <p>Western Cape Education Department</p>
        </div>

        <div class="container">
            <div class="menu-grid">
                <div class="menu-btn" onclick="openDept('Curriculum')">
                    <i class="fa-solid fa-book-open"></i>
                    Curriculum
                </div>
                <div class="menu-btn" onclick="openDept('ISLES')">
                    <i class="fa-solid fa-graduation-cap"></i>
                    ISLES
                </div>
                <div class="menu-btn" onclick="openDept('Management')">
                    <i class="fa-solid fa-users-gear"></i>
                    Management & Gov
                </div>
                <div class="menu-btn" onclick="openDept('Finance')">
                    <i class="fa-solid fa-file-invoice-dollar"></i>
                    Finance/SCM
                </div>
                <div class="menu-btn" onclick="openDept('DMT')">
                    <i class="fa-solid fa-laptop-code"></i>
                    DMT (IT)
                </div>
                <div class="menu-btn" onclick="openDept('Circuit')">
                    <i class="fa-solid fa-map-location-dot"></i>
                    All Circuits
                </div>
            </div>
        </div>
    </div>

    <div id="directory-view" class="container">
        <button class="back-btn" onclick="window.location.reload()">⬅ Back to Departments</button>
        <h2 id="dept-title" style="color:var(--primary); text-transform: uppercase;"></h2>
        <div id="people-grid"></div>
    </div>

    <script>
        let fullData = [];

        // Fetch data immediately when page loads
        window.onload = function() {
            fetch('directory.csv')
                .then(res => res.text())
                .then(text => {
                    fullData = parseCSV(text);
                    console.log("System Ready: " + fullData.length + " staff loaded.");
                })
                .catch(err => {
                    console.error("CSV Missing!");
                    alert("System Error: directory.csv not found.");
                });
        };

        function parseCSV(text) {
            const lines = text.split('\n').filter(l => l.trim() !== '');
            if (lines.length === 0) return [];
            const headers = lines[0].split(',').map(h => h.trim());
            return lines.slice(1).map(line => {
                const values = line.split(',');
                let obj = {};
                headers.forEach((h, i) => { obj[h] = values[i] ? values[i].trim() : ''; });
                return obj;
            });
        }

        function openDept(dept) {
            // Logic to switch views
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('directory-view').style.display = 'block';
            document.getElementById('dept-title').innerText = dept;

            // Filter logic
            const filtered = fullData.filter(p => {
                const pDept = (p.Department || '').toLowerCase();
                const search = dept.toLowerCase();
                // Special case for 'Management' or 'Circuit' keywords
                return pDept.includes(search.split(' ')[0]);
            });

            render(filtered);
        }

        function render(list) {
            const grid = document.getElementById('people-grid');
            grid.innerHTML = ""; // Clear old data

            if (list.length === 0) {
                grid.innerHTML = "<h3>No matching staff records found in directory.csv</h3>";
                return;
            }

            list.sort((a,b) => (a.Name || "").localeCompare(b.Name || "")).forEach(p => {
                const card = document.createElement('div');
                card.className = 'person-card';
                card.innerHTML = `
                    <div>
                        <h3 style="margin:0; color:var(--primary);">${p.Name}</h3>
                        <p style="margin:5px 0; color:#666; font-size: 0.9rem;">${p.Role}</p>
                    </div>
                    <div class="actions">
                        <a href="mailto:${p.Email}"><i class="fa-solid fa-envelope"></i></a>
                        <a href="tel:${p.Phone}"><i class="fa-solid fa-phone"></i></a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
