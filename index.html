<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNED Staff Directory</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --mned-blue: #005596;
            --mned-gold: #ffcc00;
        }

        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background-color: #f0f2f5; }

        /* --- BANNER --- */
        .banner {
            background: linear-gradient(rgba(0, 85, 150, 0.5), rgba(0, 85, 150, 0.5)), url('banner.png');
            background-size: cover; background-position: center;
            height: 300px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white;
            border-bottom: 8px solid var(--mned-gold); text-align: center;
        }

        /* --- SEARCH --- */
        .search-area { max-width: 600px; margin: -30px auto 30px; padding: 0 20px; }
        #searchBox {
            width: 100%; padding: 18px 25px; border-radius: 50px; border: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); font-size: 1.1rem; outline: none;
        }

        /* --- TILES --- */
        .container { max-width: 1100px; margin: auto; padding: 20px; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; }
        
        .tile { 
            background: white; padding: 40px 20px; text-align: center;
            border-radius: 15px; cursor: pointer; transition: 0.3s;
            color: var(--mned-blue); font-weight: bold; font-size: 1.3rem;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            border-bottom: 5px solid var(--mned-blue);
        }

        .tile:hover { transform: translateY(-10px); background: var(--mned-blue); color: white; }

        /* --- LIST VIEW --- */
        #list-view { display: none; } /* Hidden by default */
        .staff-card { 
            background: white; padding: 20px; border-radius: 12px;
            margin-bottom: 15px; display: flex; justify-content: space-between;
            align-items: center; border-left: 6px solid var(--mned-blue);
        }

        .back-btn {
            background: var(--mned-blue); color: white; border: none;
            padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-bottom: 20px;
        }

        .contact-links a { color: var(--mned-blue); font-size: 1.5rem; margin-left: 20px; }
    </style>
</head>
<body>

    <div id="home-view">
        <div class="banner">
            <h1>MNED Staff Directory</h1>
            <p>Select a department to begin</p>
        </div>
        <div class="search-area">
            <input type="text" id="searchBox" placeholder="Search name or role..." onkeyup="runSearch()">
        </div>
        <div class="container">
            <div class="menu-grid">
                <div class="tile" onclick="showCategory('Curriculum')"><i class="fa-solid fa-book"></i>Curriculum</div>
                <div class="tile" onclick="showCategory('ISLES')"><i class="fa-solid fa-graduation-cap"></i>ISLES</div>
                <div class="tile" onclick="showCategory('Management')"><i class="fa-solid fa-tie"></i>Management & Gov</div>
                <div class="tile" onclick="showCategory('Finance')"><i class="fa-solid fa-coins"></i>Finance/SCM</div>
                <div class="tile" onclick="showCategory('DMT')"><i class="fa-solid fa-laptop"></i>DMT (IT)</div>
                <div class="tile" onclick="showCategory('Circuit')"><i class="fa-solid fa-map-pin"></i>All Circuits</div>
            </div>
        </div>
    </div>

    <div id="list-view" class="container">
        <button class="back-btn" onclick="window.location.reload()">⬅ Back</button>
        <h2 id="display-title" style="color:var(--mned-blue)"></h2>
        <div id="staff-list"></div>
    </div>

    <script>
        let masterData = [];

        // 1. Fetch Data
        window.onload = function() {
            fetch('directory.csv')
                .then(res => res.text())
                .then(csv => {
                    const rows = csv.split('\n').filter(r => r.trim() !== '');
                    const headers = rows[0].split(',').map(h => h.trim());
                    masterData = rows.slice(1).map(row => {
                        const cols = row.split(',');
                        let obj = {};
                        headers.forEach((h, i) => obj[h] = cols[i] ? cols[i].trim() : '');
                        return obj;
                    });
                });
        };

        // 2. Tile Click Function
        function showCategory(deptName) {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
            document.getElementById('display-title').innerText = deptName;

            const filtered = masterData.filter(p => 
                (p.Department || '').toLowerCase().includes(deptName.toLowerCase().split(' ')[0])
            );
            render(filtered);
        }

        // 3. Search Function
        function runSearch() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            if(query.length > 2) {
                document.getElementById('home-view').style.display = 'none';
                document.getElementById('list-view').style.display = 'block';
                document.getElementById('display-title').innerText = "Search Results";
                const results = masterData.filter(p => 
                    p.Name.toLowerCase().includes(query) || p.Role.toLowerCase().includes(query)
                );
                render(results);
            }
        }

        // 4. Render Cards
        function render(list) {
            const container = document.getElementById('staff-list');
            container.innerHTML = list.length ? "" : "<h3>No records found.</h3>";
            list.forEach(p => {
                const card = document.createElement('div');
                card.className = 'staff-card';
                card.innerHTML = `
                    <div>
                        <h3 style="margin:0">${p.Name}</h3>
                        <p>${p.Role}</p>
                    </div>
                    <div class="contact-links">
                        <a href="mailto:${p.Email}"><i class="fa-solid fa-envelope"></i></a>
                        <a href="tel:${p.Phone}"><i class="fa-solid fa-phone"></i></a>
                    </div>
                `;
                container.appendChild(card);
