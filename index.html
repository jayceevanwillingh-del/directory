<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNED Staff Directory</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #005596; /* Western Cape Blue */
            --accent: #ffcc00;  /* Gold accent */
            --grey: #f4f4f9;
        }

        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: var(--grey); }

        /* --- THE BANNER FIX --- */
        .banner {
            background: linear-gradient(rgba(0, 85, 150, 0.9), rgba(0, 85, 150, 0.9)), 
                        url('https://www.westerncape.gov.za/assets/styles/wcg_theme/logo.png'); /* Placeholder for your banner */
            background-size: cover;
            background-position: center;
            color: white;
            padding: 60px 20px;
            text-align: center;
            border-bottom: 5px solid var(--accent);
        }

        .banner h1 { margin: 0; font-size: 2.5rem; text-transform: uppercase; letter-spacing: 2px; }
        .banner p { margin-top: 10px; font-size: 1.2rem; opacity: 0.9; }

        /* --- THE TILES (GRID) --- */
        .container { max-width: 1100px; margin: -30px auto 40px; padding: 0 20px; }
        
        .menu-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 20px; 
        }

        .menu-btn { 
            background: white;
            padding: 40px 20px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: 0.3s;
            color: var(--primary);
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .menu-btn i { font-size: 3rem; color: var(--primary); } /* Icon Style */

        .menu-btn:hover { 
            background: var(--primary); 
            color: white; 
            transform: translateY(-10px); 
        }
        .menu-btn:hover i { color: white; }

        /* --- STAFF LIST DESIGN --- */
        #directory-view { display: none; padding: 20px; animation: slideUp 0.4s ease; }
        
        .person-card { 
            background: white; padding: 20px; border-radius: 10px;
            margin-bottom: 15px; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid var(--primary);
        }

        .actions a { 
            color: var(--primary); font-size: 1.5rem; margin-left: 20px; 
            text-decoration: none; transition: 0.2s;
        }
        
        .back-btn {
            background: var(--primary); color: white; border: none;
            padding: 12px 25px; border-radius: 5px; cursor: pointer;
            margin-bottom: 20px; font-weight: bold;
        }

        @keyframes slideUp { from {opacity:0; transform: translateY(20px);} to {opacity:1; transform: translateY(0);} }
    </style>
</head>
<body>

    <div id="home-view">
        <div class="banner">
            <h1>MNED Staff Directory</h1>
            <p>Western Cape Education Department</p>
        </div>

        <div class="container">
            <div class="menu-grid">
                <div class="menu-btn" onclick="openDept('Curriculum')">
                    <i class="fa-solid fa-book-open"></i>
                    Curriculum
                </div>
                <div class="menu-btn" onclick="openDept('ISLES')">
                    <i class="fa-solid fa-graduation-cap"></i>
                    ISLES
                </div>
                <div class="menu-btn" onclick="openDept('Management')">
                    <i class="fa-solid fa-users-gear"></i>
                    Management & Gov
                </div>
                <div class="menu-btn" onclick="openDept('Finance')">
                    <i class="fa-solid fa-file-invoice-dollar"></i>
                    Finance/SCM
                </div>
                <div class="menu-btn" onclick="openDept('DMT')">
                    <i class="fa-solid fa-laptop-code"></i>
                    DMT (IT)
                </div>
                <div class="menu-btn" onclick="openDept('Circuit')">
                    <i class="fa-solid fa-map-location-dot"></i>
                    All Circuits
                </div>
            </div>
        </div>
    </div>

    <div id="directory-view" class="container">
        <button class="back-btn" onclick="location.reload()">⬅ Back to Departments</button>
        <h2 id="dept-title" style="color:var(--primary);"></h2>
        <div id="people-grid"></div>
    </div>

    <script>
        let fullData = [];

        window.onload = function() {
            fetch('directory.csv')
                .then(res => res.text())
                .then(text => { fullData = parseCSV(text); })
                .catch(err => console.error("CSV file not found."));
        };

        function parseCSV(text) {
            const lines = text.split('\n').filter(l => l.trim() !== '');
            const headers = lines[0].split(',').map(h => h.trim());
            return lines.slice(1).map(line => {
                const values = line.split(',');
                let obj = {};
                headers.forEach((h, i) => { obj[h] = values[i] ? values[i].trim() : ''; });
                return obj;
            });
        }

        function openDept(dept) {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('directory-view').style.display = 'block';
            document.getElementById('dept-title').innerText = dept;
            const filtered = fullData.filter(p => (p.Department || '').toLowerCase().includes(dept.toLowerCase().split(' ')[0]));
            render(filtered);
        }

        function render(list) {
            const grid = document.getElementById('people-grid');
            grid.innerHTML = list.length ? "" : "<h3>No records found.</h3>";
            list.forEach(p => {
                const div = document.createElement('div');
                div.className = 'person-card';
                div.innerHTML = `
                    <div>
                        <h3 style="margin:0; color:var(--primary);">${p.Name}</h3>
                        <p style="margin:5px 0; color:#666;">${p.Role}</p>
                    </div>
                    <div class="actions">
                        <a href="mailto:${p.Email}"><i class="fa-solid fa-envelope"></i></a>
                        <a href="tel:${p.Phone}"><i class="fa-solid fa-phone"></i></a>
                    </div>
                `;
                grid.appendChild(div);
            });
        }
    </script>
</body>
</html>
